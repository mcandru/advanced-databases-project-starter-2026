name: advanced-databases-project

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    command:
      - --skip-log-bin
      # Comfortably large limits so that importing big .sql dumps just works.
      - --max-allowed-packet=1G
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      # This project folder, so you can import any .sql file you save here.
      - ./:/work
    configs:
      - source: mysql-client-config
        target: /etc/mysql/conf.d/client.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 4G
      MEMORY_LIMIT: 2G
      MAX_EXECUTION_TIME: 0
    ports:
      - "${PMA_PORT:-8084}:80"
    volumes:
      - ./:/work
    configs:
      - source: phpmyadmin-config
        target: /etc/phpmyadmin/config.user.inc.php
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

configs:
  # Make the mysql command line client use utf8mb4, so text like "Seán" or
  # emoji in .sql files you run through it is stored correctly.
  mysql-client-config:
    content: |
      [client]
      default-character-set=utf8mb4
  phpmyadmin-config:
    content: |
      <?php
      // Any .sql or .gz file saved in this project folder can be imported
      // straight from disk: Import tab -> "Select file to import".
      $$cfg['UploadDir'] = '/work';
      // Keep the query box on screen after running a query.
      $$cfg['RetainQueryBox'] = true;
      // Don't give up on long imports.
      $$cfg['ExecTimeLimit'] = 0;
      // No lab uses phpMyAdmin's optional configuration storage (bookmarks,
      // the designer), so hide the banner that asks you to set it up.
      $$cfg['PmaNoRelation_DisableWarning'] = true;
      $$cfg['ShowSQL'] = true;
      $$cfg['SendErrorReports'] = 'never';
